name: Silver Command 0.5 QA
on:
  push:
    paths: ['silver-command-05/**', '.github/workflows/silver-command-05-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright/python:v1.55.0-noble
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node silver-command-05/model.test.cjs
      - run: python -m pip install playwright==1.55.0
      - run: python silver-command-05/browser_qa.py
        env:
          ENGINE: ${{ matrix.engine }}
          QA_IMAGES: /tmp/nvtsk-visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-${{ matrix.engine }}
          path: /tmp/nvtsk-visual
          retention-days: 7
