name: Silver Command 0.5 QA
on:
  push:
    paths: ['silver-command-05/**', '.github/workflows/silver-command-05-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node silver-command-05/model.test.cjs
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps "$ENGINE"
        env:
          ENGINE: ${{ matrix.engine }}
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/nvtsk-server.log 2>&1 &
          python silver-command-05/browser_qa.py http://127.0.0.1:8765/silver-command-05/
        env:
          ENGINE: ${{ matrix.engine }}
