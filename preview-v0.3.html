<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}input{min-width:0;color:var(--txt);background:#0e161e;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;outline:none}input:focus{border-color:var(--gold)}.app{min-height:100vh;max-width:1460px;margin:auto;display:grid;grid-template-columns:222px minmax(0,1fr)}.aside{background:linear-gradient(180deg,#111b23,#0a1117);border-right:1px solid #24303a;padding:30px 16px;position:sticky;top:0;align-self:start;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:0 11px 32px}.mark{height:46px;width:46px;border:1px solid #9e7e40;display:grid;place-items:center;background:linear-gradient(135deg,#fff0ac,#9e7731 45%,#f8d99e);font-size:26px;font-weight:1000;color:#0a1218;box-shadow:0 1px 15px #cfb27730;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.brandname{font-size:19px;letter-spacing:2px;font-weight:850}.sublogo{font-size:9px;color:var(--gold);letter-spacing:2px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{width:100%;padding:13px 15px;background:transparent;border:1px solid transparent;border-radius:12px;text-align:left;color:#9facb1;font-weight:650}.nav button.active{background:#2b302e;border-color:#5b5543;color:var(--gold2)}.nav button:hover{background:#26313b}.asidefoot{position:absolute;bottom:25px;left:25px;color:#7b898e;font-size:11px}.main{min-width:0;padding:24px 30px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:10px;font-weight:800;color:var(--gold)}h1{margin:2px 0 0;font-size:29px;letter-spacing:.2px}h2{font-size:19px;margin:0 0 17px}h3{font-size:15px;margin:0 0 9px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.btn{background:#293640;color:var(--txt);border:1px solid #435361;padding:11px 15px;border-radius:10px;font-weight:700}.btn:hover{filter:brightness(1.16)}.btn.primary{background:linear-gradient(135deg,#f1d49a,#b78b48);color:#121416;border:0}.btn.outline{background:transparent;border-color:#8b7450;color:var(--gold)}.btn.green{background:#214939;color:#9de2bb;border:1px solid #3e8a69}.btn.sm{font-size:12px;padding:7px 10px}.pill{display:inline-block;color:var(--gold2);border:1px solid #69573f;border-radius:30px;padding:4px 9px;background:#3a302326;font-size:11px;font-weight:750}.pill.green{border-color:#386d54;color:#91dfb6;background:#1f3b30}.pill.red{border-color:#805049;color:#f5a79a;background:#3b2828}.pill.blue{border-color:#42738d;color:#a3d8fc;background:#27394a}.panel{background:linear-gradient(180deg,#15212b,#111922);border:1px solid #293744;border-radius:18px;padding:20px;box-shadow:0 3px 15px #0002}.grid{display:grid;gap:16px}.twocol{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 75% -15%,#8c774141,transparent 45%),linear-gradient(120deg,#172631,#101920 80%);padding:29px}.hero:before{content:"N";position:absolute;right:38px;top:-85px;font-size:330px;color:#d5ad5530;font-weight:950;pointer-events:none}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.split{display:flex;justify-content:space-between;align-items:center;gap:14px}.stat{font-size:29px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}.progress{height:9px;background:#2a3842;border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#96783d,#efd08a);border-radius:inherit}.stack{display:grid;gap:12px}.label{font-size:12px;color:#96a4aa;margin-bottom:5px}.divider{height:1px;background:#2d3944;margin:14px 0}.listitem{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111b23;border:1px solid #2b3a45;border-radius:12px;padding:12px 14px}.listitem:hover{border-color:#9b7d49}.lotcard{background:#121d26;border:1px solid #2f3d49;border-radius:15px;padding:18px;display:grid;gap:10px}.lotcard .big{font-size:25px;font-weight:820;color:#ecd09b}.lotcard:hover{border-color:#9e8555}.map{height:530px;position:relative;overflow:hidden;border:1px solid #4a5a5e;border-radius:17px;background:radial-gradient(circle at 60% 52%,#244657,#11242f 70%);touch-action:none;cursor:grab}.map:active{cursor:grabbing}.mapcanvas{position:absolute;width:100%;height:100%;inset:0;transform-origin:50% 50%;user-select:none}.map svg{width:100%;height:100%;position:absolute;inset:0}.pin{position:absolute;transform:translate(-50%,-50%);border:0;color:#0f181d;background:linear-gradient(140deg,#ffe8aa,#b58b3d);font-weight:850;font-size:12px;min-width:46px;min-height:46px;border-radius:50%;box-shadow:0 0 0 6px #f5c97320,0 0 28px #efba6480;display:flex;align-items:center;justify-content:center;transition:filter .15s}.pin span{pointer-events:none}.pin:hover,.pin.sel{box-shadow:0 0 0 10px #f8c97342,0 0 33px #e2c67b;filter:brightness(1.12)}.city{position:absolute;color:#dce7ea;opacity:.75;font-size:13px;font-weight:650;text-shadow:0 1px 4px black;pointer-events:none}.mapfloat{position:absolute;bottom:15px;left:15px;right:15px;display:flex;gap:8px;align-items:flex-end;justify-content:space-between;pointer-events:none}.mapfloat>*{pointer-events:auto}.mapnote{background:#0b151cde;border:1px solid #49616b;border-radius:11px;padding:10px 13px;font-size:11px;color:#b3c6cd}.zoom{display:flex;flex-direction:column;gap:5px}.zoom button{width:39px;height:39px;border:1px solid #465f6a;background:#0d1a23db;color:white;border-radius:9px;font-size:21px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.tabs button{padding:9px 14px;border-radius:25px;border:1px solid #364753;background:#17232c;color:#b7c5c8;font-weight:700}.tabs button.active{background:#514634;color:#ffe1a3;border-color:#ad8c59}.avatar{height:48px;width:48px;flex:none;display:grid;place-items:center;border-radius:15px;border:1px solid #77653e;background:linear-gradient(150deg,#665333,#252f38);color:#ffe0a2;font-weight:900;font-size:19px}.person{display:flex;align-items:center;gap:12px}.tag{font-size:11px;color:#b7c6c8;background:#21313d;padding:5px 8px;border-radius:6px}.notice{border-left:3px solid var(--gold);background:#312c203d;padding:11px 13px;border-radius:8px;color:#dfcda9;font-size:12px}.bidrow{padding:11px;border-radius:10px;background:#14242c;border:1px solid #2a4347;margin-bottom:8px}.bidrow.best{border-color:#4b9f70;background:#1b302b}.bottomnav{display:none}.screen{display:none}.screen.active{display:block;animation:fade .18s ease}@keyframes fade{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}.toast{position:fixed;bottom:25px;right:26px;z-index:80;background:#d9c08b;color:#111920;padding:11px 17px;border-radius:12px;font-weight:750;box-shadow:var(--shadow);max-width:380px;display:none;pointer-events:none}.toast.show{display:block}.modalback{position:fixed;inset:0;background:#000b;z-index:40;display:none;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{border:1px solid #63737c;background:#13202a;border-radius:17px;padding:24px;width:min(520px,100%);box-shadow:var(--shadow);max-height:85vh;overflow:auto}.inputrow{display:flex;gap:10px}.inputrow input{flex:1}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{background:#25323d;border:1px solid #455665;color:#c2d2d3;border-radius:10px;padding:7px 10px}.filters button.active{background:#54432b;color:#ffe0a2;border-color:#ad8c59}.kbd{font-size:11px;background:#303c43;border:1px solid #58636c;border-radius:5px;padding:3px 5px;color:#dce6e5}.dim{opacity:.7}.gold{color:var(--gold2)}.greenText{color:var(--mint)}.redText{color:var(--red)}.hint{color:#9daeb8;font-size:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:0 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hide{display:none!important}
@media(max-width:1040px){.twocol{grid-template-columns:1fr}.three,.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:740px){.app{display:block}.aside{display:none}.main{padding:17px 14px 94px}.top{margin-bottom:18px}.top .btn{font-size:11px}.top h1{font-size:23px}.three,.four{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.panel{padding:15px;border-radius:14px}.stat{font-size:23px}.map{height:min(64vh,510px)}.hero{padding:18px}.hero:before{font-size:210px;top:-48px;right:0}.bottomnav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:2px;background:#101a23f5;border-top:1px solid #39464e;padding:8px 2px max(9px,env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 20px #0005}.bottomnav button{background:transparent;border:0;color:#9eaaad;min-width:62px;font-size:10px;font-weight:750;display:flex;flex-direction:column;gap:3px;align-items:center}.bottomnav button span{font-size:20px}.bottomnav button.active{color:#f5d395}.inputrow{flex-direction:column}.mapnote{max-width:220px}.city{font-size:11px}}
</style>
</head>
<body>
<div class="app">
<aside class="aside"><div class="brand"><div class="mark">N</div><div><div class="brandname">NVTSK</div><div class="sublogo">SYSTEM • MVP</div></div></div><nav class="nav" id="sideNav"></nav><div class="asidefoot">Prototype 0.2 • Demo only<br/>Данные вымышлены</div></aside>
<main class="main"><div id="bootNotice" style="background:#1b2630;color:#ffe0a2;padding:12px 14px;border:1px solid #76613b;border-radius:12px;margin:0 0 14px;line-height:1.5"><strong>Важно:</strong> предпросмотр файлов в чате может отключать JavaScript. Для интерактивной версии скачайте HTML и откройте его в обычном браузере, а не в предпросмотре файла.</div><div class="top"><div><div class="eyebrow">NVTSK • SOLAR OPERATIONS</div><h1 id="pagetitle">Лобби</h1></div><div class="flex"><span class="pill green">● DEMO</span><button class="btn sm" id="resetBtn">↺ Сброс</button></div></div>
<section class="screen" id="home"></section><section class="screen" id="map"></section><section class="screen" id="lots"></section><section class="screen" id="crew"></section><section class="screen" id="community"></section>
</main></div><div class="bottomnav" id="bottomNav"></div><div class="toast" id="toast"></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div>
<noscript><p style="margin:14px;padding:15px;background:#26313a;color:white">В этом просмотрщике JavaScript отключён. Скачайте файл и откройте его в Safari, Chrome или другом браузере, чтобы нажимать кнопки.</p></noscript>
<script>
(() => {
'use strict';console.info('NVTSK MVP v0.2 — интерфейс запущен');
const menus=[['home','⌂','Лобби'],['map','⌾','Карта'],['lots','▤','Лоты'],['crew','♟','Команда'],['community','♧','Сообщество']];
const lots=[
{id:1,city:'Stockach',lat:'47.85° N',title:'Скатная кровля · 20 кВт',kw:20,client:'Solarbau Süd GmbH',kind:'DC',price:2000,deadline:'27.11.2026',start:'01.12.2026',days:5,minimum:2,experience:10,needsTools:true,needsVehicle:true,description:'Монтаж PV на скатной кровле: Unterkonstruktion, модули, DC-кабель, маркировка стрингов. Подключение AC не входит.',pos:[30,25],bids:[{team:'Solar Crew Süd',price:1700,legacy:4300},{team:'DachSolar Team',price:1600,legacy:2000}]},
{id:2,city:'Singen',lat:'47.76° N',title:'Частный дом · 14,8 кВт',kw:14.8,client:'Hegau Energie',kind:'DC',price:1480,deadline:'29.11.2026',start:'04.12.2026',days:3,minimum:2,experience:8,needsTools:true,needsVehicle:false,description:'Черепичная крыша, монтаж DC и прокладка кабельных трасс. Леса и подъемник предоставляет заказчик.',pos:[24,61],bids:[{team:'SüdMontage',price:1380,legacy:3100}]},
{id:3,city:'Überlingen',lat:'47.77° N',title:'Инвертор и AC · 12 кВт',kw:12,client:'Bodensee PV Service',kind:'AC',price:1200,deadline:'02.12.2026',start:'10.12.2026',days:2,minimum:2,experience:5,needsTools:true,needsVehicle:false,description:'Инвертор, AC-обвязка и пусконаладка. Электротехнические работы только квалифицированной компанией / Elektrofachkraft.',pos:[62,50],bids:[{team:'Elektro See',price:1120,legacy:7000}]}
];
const people=[{id:'roman',name:'Роман',job:'DC-монтажник',legacy:4200,ac:false,dc:true,icon:'Р',loc:'Singen'},{id:'denis',name:'Денис',job:'DC + логистика',legacy:3100,ac:false,dc:true,icon:'Д',loc:'Stockach'},{id:'olena',name:'Олена',job:'Elektrofachkraft · AC',legacy:7100,ac:true,dc:false,icon:'О',loc:'Konstanz'},{id:'artem',name:'Артём',job:'Монтажник PV',legacy:2100,ac:false,dc:true,icon:'А',loc:'Überlingen'}];
const defaults={screen:'home',communityTab:'installers',selectedLot:1,detail:false,team:['sergey'],teamName:'Solar Crew Süd',hasTools:true,hasVehicle:true,merit:3000,xp:24650,legacy:{dc:8500,ac:3200,engineering:1500,leadership:2000},bids:{},completed:[],purchases:[],checklist:{},achievements:[],mapZoom:1,filter:'all'};
const storeKey='nvtsk-mvp-2026-v2';const fresh=()=>JSON.parse(JSON.stringify(defaults));let st;try{st=Object.assign(fresh(),JSON.parse(localStorage.getItem(storeKey)||'{}'))}catch(e){st=fresh()};
const $=s=>document.querySelector(s), fmt=n=>Math.round(n).toLocaleString('ru-RU'), esc=s=>String(s).replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function save(){try{localStorage.setItem(storeKey,JSON.stringify(st))}catch(e){}};
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.nt);window.nt=setTimeout(()=>el.classList.remove('show'),3200)}
function nav(id){st.screen=id;st.detail=false;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function openModal(html){$('#modal').innerHTML=html;$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show')}
function isQualified(lot){const members=st.team.map(i=>i==='sergey'?{dc:true,ac:false}:people.find(p=>p.id===i)).filter(Boolean);const skill=lot.kind==='AC'?members.some(p=>p.ac):members.some(p=>p.dc);return {ok:members.length>=lot.minimum && skill && (!lot.needsTools||st.hasTools)&&(!lot.needsVehicle||st.hasVehicle),members:members.length,skill}}
function crewNames(){return st.team.map(id=>id==='sergey'?'Серёжа':people.find(p=>p.id===id)?.name).filter(Boolean).join(', ')}
function level(){return 12+Math.floor(Math.max(0,st.xp-24650)/2000)}
function logRows(){return Object.entries(st.legacy).map(([key,val])=>{const names={dc:'🏠 DC-монтаж',ac:'⚡ AC-электрика',engineering:'📐 Проектирование',leadership:'👥 Руководство'};return `<div><div class="split small"><b>${names[key]}</b><span class="gold">${fmt(val)} Legacy</span></div><div class="progress" style="margin-top:6px"><i style="width:${Math.min(100,Math.round(val/9000*100))}%"></i></div></div>`}).join('')}
function render(){const boot=document.getElementById('bootNotice');if(boot)boot.remove();const id=st.screen;$('#pagetitle').textContent=menus.find(m=>m[0]===id)[2];$('#sideNav').innerHTML=menus.map(m=>`<button data-nav="${m[0]}" class="${id===m[0]?'active':''}">${m[1]} &nbsp; ${m[2]}</button>`).join('');$('#bottomNav').innerHTML=menus.map(m=>`<button data-nav="${m[0]}" class="${id===m[0]?'active':''}"><span>${m[1]}</span>${m[2]}</button>`).join('');
for(const node of document.querySelectorAll('.screen'))node.classList.toggle('active',node.id===id);
if(id==='home')home();if(id==='map')map();if(id==='lots')lotsPage();if(id==='crew')crew();if(id==='community')community();bindCommon();}
function bindCommon(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));}
function home(){$('#home').innerHTML=`<div class="panel hero" style="margin-bottom:16px"><div class="eyebrow">МОЙ ПЕРСОНАЖ</div><h2 style="font-size:28px;margin:12px 0 3px">Серёжа Монтажник</h2><div class="muted">DC Installer • Боденское озеро • Solar Crew Süd</div><div class="flex" style="margin-top:20px"><span class="pill">Уровень ${level()}</span><span class="pill green">⭐ Рейтинг 4,9 / 5</span><span class="pill blue">DC Specialist</span></div><div style="margin-top:22px;max-width:500px"><div class="split small"><span>До следующего уровня</span><b>${fmt(st.xp)} XP</b></div><div class="progress" style="margin-top:7px"><i style="width:${20+(st.xp%2000)/2000*80}%"></i></div></div></div>
<div class="grid three" style="margin-bottom:16px"><div class="panel"><div class="label">⚡ Опыт (XP)</div><div class="stat">${fmt(st.xp)}</div><div class="hint">Растёт за действия и работу</div></div><div class="panel"><div class="label">◈ Merit • доступно</div><div class="stat">${fmt(st.merit)}</div><button class="btn sm outline" id="storeButton">Открыть магазин</button></div><div class="panel"><div class="label">🏆 Legacy • накоплено</div><div class="stat">${fmt(Object.values(st.legacy).reduce((a,b)=>a+b,0))}</div><div class="hint">Не уменьшается при тратах</div></div></div>
<div class="grid twocol"><div class="panel"><h2>Дерево профессионального опыта</h2><div class="stack">${logRows()}</div></div><div class="panel"><h2>Достижения</h2><div class="listitem"><span>🏅 1000 PV-модулей</span><span class="pill green">Демо-награда</span></div><div style="height:9px"></div><div class="listitem"><span>🛠️ Работа без замечаний</span><span class="pill">+ Merit</span></div><div style="height:9px"></div><div class="listitem"><span>🏁 Первый лот NVTSK</span><span class="pill blue">Прогресс</span></div><div class="divider"></div><div class="actions"><button class="btn primary" data-nav="map">Найти объект ↗</button><button class="btn" data-nav="crew">Моя бригада</button></div></div></div>`;$('#storeButton').onclick=store;bindCommon()}
function store(){let products=[['🧤','Рабочие перчатки',250],['🪛','Набор бит',500],['🎓','Модуль обучения DC',800]];openModal(`<div class="split"><h2>Магазин Merit</h2><button class="btn sm" data-close>✕</button></div><p class="muted small">Демо-магазин. Покупки виртуальные, реальных заказов и списаний нет.</p><div class="pill">Баланс: ${fmt(st.merit)} Merit</div><div class="stack" style="margin-top:16px">${products.map((p,i)=>`<div class="listitem"><span>${p[0]} ${p[1]} <div class="hint">${p[2]} Merit</div></span><button class="btn sm primary" data-buy="${i}" ${st.merit<p[2]?'disabled':''}>Обменять</button></div>`).join('')}</div>`);document.querySelector('[data-close]').onclick=closeModal;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const p=products[+b.dataset.buy];if(st.merit<p[2])return;st.merit-=p[2];st.purchases.push(p[1]);save();closeModal();render();toast('Демо-покупка: '+p[1])})}
function map(){$('#map').innerHTML=`<div class="sectionhead"><div><h2>Активные объекты на карте</h2><div class="muted small">Выбери светящуюся точку, чтобы открыть лот • Регион Bodensee</div></div><span class="pill green">${lots.length} объекта</span></div><div class="map" id="mapbox"><div class="mapcanvas" id="mapcanvas"><svg viewBox="0 0 900 560" preserveAspectRatio="none" aria-label="Схематичная карта региона Боденского озера"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M 46 0 L 0 0 0 46" fill="none" stroke="#526f78" stroke-width=".6" opacity=".25"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="900" height="560" fill="url(#grid)"/><path d="M20 390 Q170 324 250 395 T440 440 Q530 411 570 370 T720 440 L900 480 L900 560 L0 560 Z" fill="#12394b" stroke="#44879c" stroke-width="2"/><path d="M0 370 Q200 322 420 392 T900 470" stroke="#638aa1" opacity=".16" stroke-width="24" fill="none" filter="url(#glow)"/><path d="M-20 110 Q180 180 290 145 T560 210 T950 180 M20 480 Q210 350 310 290 T690 90 M100 0 Q330 100 420 310 T890 420 M0 280 Q150 220 250 290 T590 240 T920 300" stroke="#738589" stroke-width="3" stroke-dasharray="6 9" opacity=".5" fill="none"/><path d="M-20 110 Q180 180 290 145 T560 210 T950 180 M20 480 Q210 350 310 290 T690 90 M100 0 Q330 100 420 310 T890 420 M0 280 Q150 220 250 290 T590 240 T920 300" stroke="#c5d1cc" stroke-width=".8" opacity=".65" fill="none"/><text x="580" y="505" fill="#76c3d8" font-size="36" opacity=".5" letter-spacing="6">BODENSEE</text><text x="65" y="35" fill="#789298" font-size="13">SCHEMATIC MAP • DEMO</text></svg>${lots.map(l=>`<button class="pin ${st.selectedLot===l.id?'sel':''}" style="left:${l.pos[0]}%;top:${l.pos[1]}%" data-maplot="${l.id}" title="${esc(l.title)}"><span>${l.kw}</span></button>`).join('')}<div class="city" style="left:31%;top:12%">Stockach</div><div class="city" style="left:14%;top:68%">Singen</div><div class="city" style="left:63%;top:37%">Überlingen</div><div class="city" style="left:34%;top:75%">Radolfzell</div></div><div class="mapfloat"><span class="mapnote">✦ Светящиеся метки = доступные лоты<br/>Карта схематичная, не навигационная</span><div class="zoom"><button id="zoomIn">+</button><button id="zoomOut">−</button></div></div></div><div id="maplotcard" style="margin-top:14px"></div>`;
$('#mapbox').querySelectorAll('[data-maplot]').forEach(b=>b.onclick=e=>{e.stopPropagation();st.selectedLot=+b.dataset.maplot;save();updateMapLot();$('#mapcanvas').querySelectorAll('.pin').forEach(p=>p.classList.toggle('sel',+p.dataset.maplot===st.selectedLot))});const canvas=$('#mapcanvas');function apply(){canvas.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${st.mapZoom})`};let pan={x:0,y:0},drag=null;$('#zoomIn').onclick=()=>{st.mapZoom=Math.min(2,st.mapZoom+.25);apply();save()};$('#zoomOut').onclick=()=>{st.mapZoom=Math.max(1,st.mapZoom-.25);apply();save()};const box=$('#mapbox');box.onpointerdown=e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};box.setPointerCapture(e.pointerId)};box.onpointermove=e=>{if(!drag)return;pan.x=drag.px+e.clientX-drag.x;pan.y=drag.py+e.clientY-drag.y;apply()};box.onpointerup=()=>{drag=null};apply();updateMapLot()}
function updateMapLot(){const l=lots.find(x=>x.id===st.selectedLot),q=isQualified(l),best=Math.min(l.price,...l.bids.map(b=>b.price),...(st.bids[l.id]?[st.bids[l.id]]:[]));$('#maplotcard').innerHTML=`<div class="panel split" style="align-items:flex-start"><div><span class="pill">${l.city}</span> <span class="pill ${q.ok?'green':'red'}">${q.ok?'Ваша команда подходит':'Требуется команда'}</span><h2 style="margin:10px 0 4px">⚡ ${l.title}</h2><div class="muted small">Старт ${l.start} • ${l.days} дней • Приём ставок до ${l.deadline}</div><div style="margin-top:7px" class="gold">Лучшее предложение: ${fmt(best)} €</div></div><button class="btn primary" id="openSelectedLot">Открыть лот ↗</button></div>`;$('#openSelectedLot').onclick=()=>openLot(l.id)}

function lotsPage(){if(st.detail){lotDetail();return}const visible=lots.filter(l=>st.filter==='all'||l.kind===st.filter);$('#lots').innerHTML=`<div class="sectionhead"><div><h2>Биржа монтажных лотов</h2><div class="small muted">Ставки, требования и подбор бригады</div></div><span class="pill">3 активных</span></div><div class="filters" style="margin-bottom:17px"><button data-filter="all" class="${st.filter==='all'?'active':''}">Все</button><button data-filter="DC" class="${st.filter==='DC'?'active':''}">DC</button><button data-filter="AC" class="${st.filter==='AC'?'active':''}">AC</button></div><div class="grid three">${visible.map(l=>{const q=isQualified(l);return `<div class="lotcard"><div class="split"><span class="pill blue">${l.city}</span><span class="pill ${q.ok?'green':'red'}">${q.ok?'Доступен':'Заблокирован'}</span></div><div><h3 style="font-size:19px">${l.title}</h3><div class="muted small">${l.client}</div></div><div class="big">${fmt(l.price)} €</div><div class="muted small">Бюджет заказчика · ${l.minimum} участника · ${l.days} дня/дней</div><div class="muted small">Старт ${l.start}</div><button class="btn primary" data-lot="${l.id}">Открыть лот →</button></div>`}).join('')}</div>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{st.filter=b.dataset.filter;save();lotsPage()});document.querySelectorAll('[data-lot]').forEach(b=>b.onclick=()=>openLot(+b.dataset.lot))}
function lotDetail(){const l=lots.find(x=>x.id===st.selectedLot),q=isQualified(l),best=Math.min(l.price,...l.bids.map(b=>b.price),...(st.bids[l.id]?[st.bids[l.id]]:[])),requirements=[['Количество людей',`${q.members} / ${l.minimum}`,q.members>=l.minimum],['Профиль '+l.kind,l.kind==='AC'?'Требуется Elektrofachkraft':'Опыт PV DC',q.skill],['Инструменты',st.hasTools?'Есть':'Не отмечены',!l.needsTools||st.hasTools],['Транспорт',st.hasVehicle?'Есть':'Не отмечен',!l.needsVehicle||st.hasVehicle]];

checklist[l.id+'report']?'checked':''}></label><button class="btn green" style="margin-top:11px" id="finishLot" ${st.completed.includes(l.id)?'disabled':''}>${st.completed.includes(l.id)?'✓ Награда уже получена':'Демо: принять работу и выдать награду'}</button><p class="hint">В настоящем продукте сдачу утверждает заказчик, а при споре привлекается согласованный независимый эксперт.</p></div></div><div class="stack"><div class="panel"><h2>Аукцион</h2><div class="label">Лучшее предложение</div><div class="stat greenText">${fmt(best)} €</div><div class="divider"></div>${[...l.bids,...(st.bids[l.id]?[{team:st.teamName+' (вы)',price:st.bids[l.id],legacy:15200}]:[])].sort((a,b)=>a.price-b.price).map((b,i)=>`<div class="bidrow ${i===0?'best':''}"><div class="split"><b>${esc(b.team)}</b><strong>${fmt(b.price)} €</strong></div><div class="muted small">Legacy ${fmt(b.legacy)} ${i===0?' • 🟢 Минимальная цена':''}</div></div>`).join('')}<div class="divider"></div><div class="label">Моя ставка (€)</div><div class="inputrow"><input type="number" id="bidInput" value="${Math.max(1,best-50)}" min="1" step="10"><button class="btn primary" id="placeBid" ${!q.ok?'disabled':''}>Предложить цену</button></div><div class="hint" style="margin-top:9px">Ставки тестовые и остаются только в твоём браузере.</div></div><div class="panel"><h2>⚖️ Спорные ситуации</h2><p class="muted small">Стороны совместно выбирают независимого медиатора с подтверждённой квалификацией. Роль предусмотрена в концепции, решение споров пока не реализовано.</p></div></div></div>`;
$('#backLots').onclick=()=>{st.detail=false;save();render()};if($('#goCrew'))$('#goCrew').onclick=()=>nav('crew');$('#placeBid').onclick=()=>{const p=Number($('#bidInput').value);if(!Number.isFinite(p)||p<=0){toast('Введи корректную цену');return}if(!isQualified(l).ok){toast('Команда не соответствует требованиям');return}st.bids[l.id]=p;save();toast('Тестовая ставка '+fmt(p)+' € добавлена');lotDetail()};document.querySelectorAll('[data-check]').forEach(i=>i.onchange=()=>{st.checklist[l.id+i.dataset.check]=i.checked;save()});$('#finishLot').onclick=()=>{if(!st.checklist[l.id+'photo']||!st.checklist[l.id+'report']){toast('Сначала отметь оба пункта чек-листа');return}if(!isQualified(l).ok){toast('Сначала собери команду по требованиям');return}if(st.completed.includes(l.id))return;st.completed.push(l.id);st.xp+=500;st.merit+=100;st.legacy[l.kind.toLowerCase()]+=200;save();toast('Демо-награда: +500 XP, +100 Merit, +200 '+l.kind+' Legacy');lotDetail()}}
function crew(){$('#crew').innerHTML=`<div class="panel hero" style="margin-bottom:16px"><div class="eyebrow">МОЙ ОТРЯД</div><h2 style="font-size:28px;margin:9px 0">🛡 ${esc(st.teamName)}</h2><div class="muted">Временная команда на объект, по логике игрового отряда</div><div class="flex" style="margin-top:18px"><span class="pill">${st.team.length} участников</span><span class="pill green">Капитан: Серёжа</span><span class="pill">Demo Squad</span></div></div><div class="grid twocol"><div class="stack"><div class="panel"><h2>Состав бригады</h2><div class="stack">${st.team.map(id=>{const p=id==='sergey'?{name:'Серёжа',job:'Капитан · DC-монтаж',icon:'С',legacy:8500}:people.find(p=>p.id===id);return `<div class="listitem"><div class="person"><div class="avatar">${p.icon}</div><div><b>${p.name}</b><div class="muted tiny">${p.job}</div></div></div>${id==='sergey'?'<span class="pill">Капитан</span>':`<button class="btn sm" data-remove="${id}">Убрать</button>`}</div>`}).join('')}</div><div class="divider"></div><button class="btn primary" data-nav="community">+ Пригласить монтажника</button></div><div class="panel"><h2>Оснащение команды</h2><label class="listitem"><span>🧰 Инструменты для PV</span><input type="checkbox" id="toolsCheck" style="width:18px" ${st.hasTools?'checked':''}></label><label class="listitem"><span>🚐 Транспорт</span><input type="checkbox" id="vehicleCheck" style="width:18px" ${st.hasVehicle?'checked':''}></label><p class="muted small">В демо эти параметры отмечаются вручную. В рабочей системе потребуется подтверждение.</p></div></div><div class="stack"><div class="panel"><h2>Доступ к лотам</h2>${lots.map(l=>{const q=isQualified(l);return `<div class="listitem"><div><b>${l.city} · ${l.kw} кВт</b><div class="muted small">${l.kind} • ${l.minimum} человека</div></div><button class="btn sm ${q.ok?'green':''}" data-golot="${l.id}">${q.ok?'Открыть':'🔒 Условия'}</button></div>`}).join('')}</div><div class="panel"><h2>Командная статистика</h2><div class="grid three ["Module","Раскладка PV-модулей и крепление"],
["DC / Stringplan","Стринги, кабельные трассы и маркировка"],
["Erdung","Заземление, зажимы, клеммы и уравнивание потенциалов"],
["Dachausgang","Фото выхода кабеля с крыши"],
["Kabelkanal","Кабель-канал и спуск в здание"],
["Zusatzarbeiten","Дополнительные работы и проблемы"]
];
const empty={lots:{},posts:{},profile:{name:"Серёжа Монтажник",phone:"",role:"DC Montage",city:"Stockach"},rewards:{}};
let data;
try{data=Object.assign({},empty,JSON.parse(localStorage.getItem(K)||"{}"));data.lots||={};data.posts||={};data.profile||=empty.profile;data.rewards||={};}catch(_){data=JSON.parse(JSON.stringify(empty));}
const assets={};
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(data));}catch(_){alert("Лимит браузерного хранилища достигнут");}};
const getLot=id=>(data.lots[id]||={address:"",stages:{},docs:[]});
const key=(id,n,p)=>id+"-"+n+"-"+p;
const stage=(lot,n)=>(lot.stages[n]||={before:false,after:false,approved:false});
function styles(){
if($("#v03style"))return;
let x=document.createElement("style");x.id="v03style";
x.textContent=".v03{margin:18px 0;padding:20px;background:#12202a;border:1px solid #3b5363;border-radius:18px}.v03 h2{margin:0 0 12px}.v03grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.v03tile{padding:15px;background:#182b34;border:1px solid #30434b;border-radius:14px}.v03 small{color:#aebec3}.v03btn{background:#293e49;color:#eff4f1;border:1px solid #69838c;border-radius:9px;padding:8px 12px;cursor:pointer;margin:5px 5px 5px 0}.v03btn:focus-visible{outline:3px solid #ffcc82}.v03btn.gold{background:#d6b576;color:#142028;border:0;font-weight:bold}.v03 textarea{background:#0b1821;border:1px solid #536a71;border-radius:10px;color:white;padding:10px;width:100%;min-height:65px}.v03 input{margin:6px 0}.v03 img,.v03 video{max-width:100%;max-height:160px;border-radius:8px}.v03pdf{width:100%;height:460px;border:1px solid #586b76;border-radius:9px}.v03flag{color:#80dbab;font-weight:bold}.v03muted{font-size:12px;color:#abc1c9}.v03line{border-top:1px solid #41505b;margin:14px 0}.v03 file{display:block}.v03 .v03input{width:100%;max-width:540px}";
document.head.appendChild(x);
}
function renderLot(id){
let node=$("#v03lot");if(!node)return;
const lot=getLot(id),posts=data.posts[id]||[],rw=data.rewards[id]||0;
const confirmed=phases.filter((_,i)=>stage(lot,i).approved).length;
node.innerHTML='<h2>📸 Фото-чек-лист · MVP 0.3</h2><p class="v03muted">Демо: добавленное фото «после» отправляет этап на проверку, заказчик подтверждает вручную. Медиафайлы и PDF пока хранятся только в открытой вкладке.</p>'+
'<div><strong>'+confirmed+' / '+phases.length+' этапов подтверждено</strong></div>'+
'<div class="v03grid">'+phases.map((p,i)=>{
const s=stage(lot,i),a=assets[key(id,i,"before")],b=assets[key(id,i,"after")];
const status=s.approved?"✅ Принято":s.after?"🟡 На проверке":"⚪ Ожидает";
return '<section class="v03tile"><strong>'+(i+1)+'. '+p[0]+'</strong><p class="v03muted">'+p[1]+'</p><div>'+status+'</div>'+
'<label class="v03muted">Фото/видео до <input type="file" accept="image/*,video/*" data-v03file="'+i+':before"></label>'+
(a?'<div>'+preview(a)+'</div>':(s.before?'<div class="v03muted">Прикреплено в предыдущем сеансе (файл недоступен)</div>':""))+
'<label class="v03muted">Фото/видео после <input type="file" accept="image/*,video/*" data-v03file="'+i+':after"></label>'+
(b?'<div>'+preview(b)+'</div>':(s.after?'<div class="v03muted">Прикреплено в предыдущем сеансе (файл недоступен)</div>':""))+
'<div><button class="v03btn" data-v03approve="'+i+'" '+(!s.after?'disabled':'')+'>'+(s.approved?"Отменить приёмку":"✓ Подтвердить этап")+'</button></div></section>';
}).join("")+'</div>'+
'<div class="v03line"></div><h2>📑 Документы заказчика</h2><p class="v03muted">Загрузи PDF-проект, Stringplan или чертёж. Просмотр откроется прямо здесь, без стороннего приложения.</p>'+
'<input type="file" accept="application/pdf,.pdf" id="v03pdf" aria-label="Загрузить PDF"><div id="v03pdfwrap"></div>'+
'<div class="v03line"></div><h2>📍 Адрес объекта</h2><input class="v03input" id="v03address" placeholder="Полный адрес от заказчика" value="'+escapeHTML(lot.address||"")+'">'+
'<button class="v03btn" id="v03addressSave">Сохранить</button><button class="v03btn" id="v03navigate">Открыть навигацию</button>'+
'<div class="v03line"></div><h2>💬 Лента объекта</h2>'+
'<textarea id="v03post" placeholder="Новый пост: ход работ, проблема, допработа…"></textarea><button class="v03btn gold" id="v03addpost">Опубликовать</button>'+
'<div>'+posts.map((p,i)=>'<div class="v03tile" style="margin-top:10px"><strong>Запись #'+(i+1)+'</strong><div>'+escapeHTML(p.text)+'</div><div class="v03muted">'+escapeHTML(p.when)+'</div><div class="v03line"></div>'+(p.comments||[]).map(c=>'<p class="v03muted">↳ '+escapeHTML(c)+'</p>').join("")+'<input placeholder="Написать комментарий" data-v03comment="'+i+'"></div>').join("")+'</div>'+
'<div class="v03line"></div><h2>⭐ Бонус Merit от заказчика</h2><p class="v03muted">Только симуляция, без платежей. 1 Merit = 0,01 € как условный расчётный курс. 200 € = 20 000 Merit. Юридический и налоговый статус требует отдельной проверки.</p>'+
'<div>Бонусы по этому лоту: <strong>'+rw.toLocaleString("ru-RU")+' Merit</strong></div><input id="v03tip" inputmode="decimal" type="number" min="0" max="10000" placeholder="Чаевые в € (пример: 200)"><button class="v03btn gold" id="v03reward">Начислить тестовые Merit</button>';
node.querySelectorAll("[data-v03file]").forEach(el=>el.onchange=e=>{
const f=e.target.files&&e.target.files[0];if(!f)return;const [iStr,p]=e.target.dataset.v03file.split(":"),i=+iStr,s=stage(lot,i);
const kk=key(id,i,p);if(assets[kk])URL.revokeObjectURL(assets[kk].url);
assets[kk]={url:URL.createObjectURL(f),type:f.type};
s[p]=true;if(p==="after")s.approved=false;save();renderLot(id);
});
node.querySelectorAll("[data-v03approve]").forEach(el=>el.onclick=()=>{
const s=stage(lot,+el.dataset.v03approve);if(!s.after)return;s.approved=!s.approved;save();renderLot(id);
});
$("#v03pdf").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){alert("Выбери PDF");return;}
const k=id+"-pdf";if(assets[k])URL.revokeObjectURL(assets[k].url);
assets[k]={url:URL.createObjectURL(f),name:f.name};renderPDF(id);};
renderPDF(id);
$("#v03addressSave").onclick=()=>{lot.address=$("#v03address").value.trim();save();};
$("#v03navigate").onclick=()=>{const address=$("#v03address").value.trim();if(!address){alert("Сначала добавь точный адрес");return;}lot.address=address;save();window.open("https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(address),"_blank","noopener");};
$("#v03addpost").onclick=()=>{const v=$("#v03post").value.trim();if(!v)return;(data.posts[id]||=[]).push({text:v,when:new Date().toLocaleString("ru-RU"),comments:[]});save();renderLot(id);};
node.querySelectorAll("[data-v03comment]").forEach(el=>el.onkeydown=e=>{if(e.key!=="Enter")return;const v=e.target.value.trim();if(!v)return;((data.posts[id]||[])[+e.target.dataset.v03comment].comments||=[]).push(v);save();renderLot(id);});
$("#v03reward").onclick=()=>{const euros=Number($("#v03tip").value);if(!Number.isFinite(euros)||euros<=0||euros>10000)return alert("Укажи сумму от 0 до 10 000 €");data.rewards[id]=(data.rewards[id]||0)+Math.round(euros*100);save();renderLot(id);};
}
function preview(f){return f.type.startsWith("video/")?'<video controls src="'+f.url+'"></video>':'<img alt="Прикреплённое фото" src="'+f.url+'">';}
function renderPDF(id){const holder=$("#v03pdfwrap");if(!holder)return;const d=assets[id+"-pdf"];holder.innerHTML=d?'<p class="v03muted">Просмотр: '+escapeHTML(d.name)+'</p><iframe class="v03pdf" title="PDF проекта" src="'+d.url+'"></iframe>':'';}
function renderProfile(){
const n=$("#v03profile");if(!n)return;const p=data.profile;
n.innerHTML='<h2>👤 Мой профиль · 0.3</h2><p class="v03muted">Личные сведения сохранены локально в браузере. Без авторизации и серверной базы это только прототип.</p>'+
'<label>Имя<input id="v03name" value="'+escapeHTML(p.name||"")+'"></label><label>Телефон<input type="tel" id="v03phone" value="'+escapeHTML(p.phone||"")+'"></label>'+
'<label>Специализация<input id="v03role" value="'+escapeHTML(p.role||"")+'"></label><label>Город<input id="v03city" value="'+escapeHTML(p.city||"")+'"></label>'+
'<button class="v03btn gold" id="v03saveprofile">Сохранить профиль</button>'+(p.phone?'<a class="v03btn" href="tel:'+encodeURIComponent(p.phone)+'">Позвонить</a> <a class="v03btn" target="_blank" rel="noopener noreferrer" href="https://wa.me/'+p.phone.replace(/\D/g,"")+'">WhatsApp</a>':"")+
'<p class="v03muted">Финансовая история и история проектов будут подтягиваться из связанных записей, когда появятся аккаунты и серверная БД. Сейчас это не реальные счета.</p>';
$("#v03saveprofile").onclick=()=>{for(const k of ["name","phone","role","city"])p[k]=$("#v03"+k).value.trim();save();renderProfile();};
}
function mount(){
styles();
const lotRoot=$("#lots");
if(lotRoot&&lotRoot.classList.contains("active")&&!$("#v03lot")){
const text=(lotRoot.querySelector(".eyebrow")||{}).textContent||"";
const m=text.match(/ЛОТ NV-0*(\d+)/);
if(m){const node=document.createElement("section");node.id="v03lot";node.className="v03";lotRoot.appendChild(node);renderLot(Number(m[1]));}
}
const home=$("#home");
if(home&&home.classList.contains("active")&&!$("#v03profile")){
const node=document.createElement("section");node.id="v03profile";node.className="v03";home.appendChild(node);renderProfile();
}
}
let scheduled=false;const observer=new MutationObserver(()=>{if(scheduled)return;scheduled=true;queueMicrotask(()=>{scheduled=false;mount();});});
observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:["class"]});
mount();
})();

</script>
</body></html>
